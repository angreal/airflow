# Render the template with angreal and run the rendered project's tests.
# This file is at the repository root, outside the template root
# `{{ airflow_name }}/`, so `angreal init` does not copy it into users' projects.
name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHON_VERSION: "3.12"
      # angreal's VirtualEnv creates the venv with uv; pin its Python.
      UV_PYTHON: "3.12"
      RENDER_DIR: ${{ github.workspace }}/../render
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes no major-version tag
        with:
          enable-cache: true
          cache-dependency-glob: |
            angreal.toml
            */*requirements.txt

      - name: Install angreal
        run: |
          python -m pip install --upgrade "angreal>=2.9.2"
          angreal --version

      - name: Use the Airflow constraints file
        # The template's venv installs `apache-airflow==<airflow_version>` with uv.
        # UV_CONSTRAINT makes every uv install in the job use Airflow's constraints
        # file, so the installs are reproducible.
        run: |
          airflow_version=$(python -c "import tomllib; print(tomllib.load(open('angreal.toml', 'rb'))['airflow_version'])")
          echo "AIRFLOW_VERSION=${airflow_version}" >> "$GITHUB_ENV"
          echo "UV_CONSTRAINT=https://raw.githubusercontent.com/apache/airflow/constraints-${airflow_version}/constraints-${PYTHON_VERSION}.txt" >> "$GITHUB_ENV"

      - name: Configure git
        # The template's init.py creates a git repository and commits to it.
        run: |
          git config --global user.name "angreal CI"
          git config --global user.email "ci@angreal.invalid"
          git config --global init.defaultBranch main

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ hashFiles('*/.pre-commit-config.yaml') }}

      - name: Render the template
        run: |
          mkdir -p "$RENDER_DIR"
          cd "$RENDER_DIR"
          angreal init --defaults "$GITHUB_WORKSPACE"
          test -d "$RENDER_DIR/airflow/.angreal"
          git -C "$RENDER_DIR/airflow" log --oneline -1

      - name: Check the rendered project
        working-directory: ${{ env.RENDER_DIR }}/airflow
        run: |
          find . -path ./.venv -prune -o -path ./.git -prune -o -type f -print | sort
          if [ -e .github/workflows/test.yaml ] || [ -e .github ]; then
            echo "::error::the rendered project contains the template repository's .github folder"
            exit 1
          fi
          echo "OK: the rendered project has no .github/workflows/test.yaml"

      - name: angreal dev-setup
        working-directory: ${{ env.RENDER_DIR }}/airflow
        run: angreal dev-setup

      - name: angreal test run --integrity
        working-directory: ${{ env.RENDER_DIR }}/airflow
        run: angreal test run --integrity

      - name: angreal test run --full
        working-directory: ${{ env.RENDER_DIR }}/airflow
        run: angreal test run --full

      - name: angreal test lint
        working-directory: ${{ env.RENDER_DIR }}/airflow
        run: angreal test lint

      # The Docker demo stack (`angreal demo start`) is not run in CI.
