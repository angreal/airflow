repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: 'v0.16.10'
    hooks:
      - id: ruff-check
        args: [--fix-only, -e]
      # Fail on Airflow 3 removals (AIR301/AIR302) and deprecated interfaces (AIR311/AIR312).
      - id: ruff-check
        name: ruff airflow 3 rules
        args: [--select, AIR3, --no-fix]


  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/codespell-project/codespell
    rev: v2.4.3
    hooks:
      - id: codespell
        name: Run codespell to check for common misspellings in files
        language: python
        types: [text]
